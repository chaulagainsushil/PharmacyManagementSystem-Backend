services:
  pms-api:
    image: pms-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pms-api
    env_file:
      - .env
    ports:
      - "5259:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      JwtSettings__SecretKey:               ${JWT_SECRET}
      JwtSettings__Issuer:                  PMS.API
      JwtSettings__Audience:                PMS.Client
      JwtSettings__ExpiryInMinutes:         ${JWT_EXPIRY_MINUTES:-60}
      AllowedOrigins:                       ${AllowedOrigins:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/category -H 'Authorization: Bearer x' -o /dev/null -w '%{http_code}' | grep -qE '200|401'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
