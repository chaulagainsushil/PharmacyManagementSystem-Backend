# Production compose — pulls the published pms-api image from the Gitea
# registry. Assumes an external/managed PostgreSQL (see DB_CONNECTION_STRING
# in .env) — this stack does not bundle a database container.
#
# Usage:
#   cp .env.example .env   # then edit with real production values
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  pms-api:
    image: ${REGISTRY:-git.samyeak.com.np}/${NAMESPACE:-siddhasoft}/${IMAGE_NAME:-pms-api}:${IMAGE_TAG:-latest}
    container_name: pms-api
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      JwtSettings__SecretKey:               ${JWT_SECRET}
      JwtSettings__Issuer:                  PMS.API
      JwtSettings__Audience:                PMS.Client
      JwtSettings__ExpiryInMinutes:         ${JWT_EXPIRY_MINUTES:-60}
      AllowedOrigins:                       ${AllowedOrigins:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      # Uploaded prescriptions, logos and signatures — survives redeploys.
      - pms-wwwroot:/app/wwwroot
    networks:
      - pms
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/category -H 'Authorization: Bearer x' -o /dev/null -w '%{http_code}' | grep -qE '200|401'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pms-wwwroot:

# Fixed subnet so the host PostgreSQL pg_hba.conf can allow exactly this range
# (connect via the gateway address, e.g. Host=172.30.50.1).
networks:
  pms:
    ipam:
      config:
        - subnet: ${PMS_SUBNET:-172.30.50.0/24}
